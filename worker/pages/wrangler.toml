name = "mo-stats"
pages_build_output_dir = "public"
compatibility_date = "2026-08-01"

# 复用 Worker 那边同一个 D1 库，两个入口读写同一份数据。
[[d1_databases]]
binding = "DB"
database_name = "mo-stats"
database_id = "784254ea-5aa2-415c-bfd3-945b9cc4bd67"

# KV：小说章节内容预热缓存（与 Worker 共享同一个 KV 命名空间）。
[[kv_namespaces]]
binding = "NOVEL_CACHE"
id = "2ff6340ff11240bf92335633cdd13678"
