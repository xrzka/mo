name = "mo-stats"
main = "index.js"
compatibility_date = "2026-08-01"

# D1：点击与访问计数。binding 保持 DB，index.js 里用的是 env.DB。
[[d1_databases]]
binding = "DB"
database_name = "mo-stats"
database_id = "784254ea-5aa2-415c-bfd3-945b9cc4bd67"

# KV：小说章节内容预热缓存（由本地 Playwright 脚本批量写入）。
[[kv_namespaces]]
binding = "NOVEL_CACHE"
id = "2ff6340ff11240bf92335633cdd13678"

# 每天清一次过期的访客指纹
[triggers]
crons = ["17 3 * * *"]
