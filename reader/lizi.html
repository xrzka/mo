<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#1a1a2e;color:#eee}
.header{background:#16213e;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;border-bottom:1px solid #0f3460}
.header h1{font-size:18px;color:#e94560}
.container{max-width:960px;margin:0 auto;padding:10px}
#mangaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:8px 0}
.manga-card{background:#16213e;border-radius:8px;overflow:hidden;cursor:pointer}
.manga-card .cover{width:100%;height:160px;object-fit:cover;background:#2a2a4a;display:block}
.manga-card .title{padding:6px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chapterList{padding:6px 0}
.chapter-item{padding:12px 14px;background:#16213e;margin-bottom:6px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.chapter-item .name{flex:1;font-size:13px}
.chapter-item .arrow{color:#e94560;font-size:18px}
.reader-area{display:none;padding:8px 0}
.reader-area img{width:100%;margin-bottom:6px;border-radius:4px;background:#2a2a4a;min-height:200px}
.reader-area .placeholder{background:#2a2a4a;border-radius:4px;height:200px;display:flex;align-items:center;justify-content:center;color:#888;margin-bottom:6px}
.back-btn{background:#e94560;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;margin-bottom:10px;font-size:14px}
.status{padding:10px;color:#888;font-size:13px;text-align:center}
.search-box{margin-bottom:12px;display:flex;gap:8px}
.search-box input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid #333;background:#16213e;color:#eee;font-size:14px}
.search-box button{padding:8px 16px;border-radius:6px;border:none;background:#e94560;color:#fff;cursor:pointer}
.tab{padding:10px 8px;color:#888;text-align:center;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;display:inline-block}
.tab.active{color:#e94560;border-bottom-color:#e94560}
.notice{background:#0f3460;color:#e94560;padding:6px 10px;border-radius:4px;margin-bottom:8px;font-size:12px}
</style>
</head>

</div>

  <span class="tab" onclick="showView('reader')">👁阅读</span>

<div class="container">

    <button onclick="doSearch()">搜索</button>
  </div>
  <div id="navBar" style="display:none;margin-bottom:10px"><button onclick="showView('list')">← 返回列表</button></div>
  <div id="mangaGrid"></div>
  <div id="chapterList"></div>
  <div id="readerArea" class="reader-area"></div>
  <div id="status" class="status">加载中...</div>

var curMangaId = "", allMangas = [], allChapters = [];

function showView(v){
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle("active",["list","chapters","reader"].indexOf(v)===i);
  ["mangaGrid","chapterList","readerArea"].forEach(function(id){document.getElementById(id).style.display="none";});
  document.getElementById("navBar").style.display="none";
  if(v==="list"){document.getElementById("mangaGrid").style.display="grid";document.getElementById("navBar").style.display="flex";document.getElementById("notice").style.display="block";}
  else if(v==="chapters"){document.getElementById("chapterList").style.display="block";document.getElementById("navBar").style.display="flex";document.getElementById("notice").style.display="none";}
  else{document.getElementById("readerArea").style.display="block";document.getElementById("notice").style.display="none";}
}

function s(msg){document.getElementById("status").textContent=msg}

function loadMangas(){
  s("加载漫画列表...");
  if(typeof EMBEDDED_MANGA_DATA!=="undefined"&&EMBEDDED_MANGA_DATA.length>0){
    allMangas=EMBEDDED_MANGA_DATA;
    renderMangas(allMangas);
    s("共 "+allMangas.length+" 部漫画");
  }else{
    s("❌ 数据加载失败，请在本地刷新重试");
  }
}

function renderMangas(mangas){
  var c=document.getElementById("mangaGrid");c.innerHTML="";
  for(var i=0;i<mangas.length;i++){
    var m=mangas[i];
    var card=document.createElement("div");card.className="manga-card";
    (function(mid,mt){card.onclick=function(){loadChapters(mid,mt);};})(m.id,m.title);
    var img=document.createElement("img");img.className="cover";img.src=m.cover||"";img.onerror=function(){this.style.display="none";};
    var title=document.createElement("div");title.className="title";title.textContent=m.title;
    card.appendChild(img);card.appendChild(title);c.appendChild(card);
  }
}

function loadChapters(mangaId,title){
  curMangaId=mangaId;allChapters=[];
  s("加载章节...");
  var m=allMangas.find(function(x){return x.id===mangaId;});
  if(!m){s("漫画未找到");return}
  allChapters=m.chapters||[];
  renderChapters(title);
  showView("chapters");
  s("共 "+allChapters.length+" 章节");
}

function renderChapters(title){
  var c=document.getElementById("chapterList");c.innerHTML="";
  var h=document.createElement("h3");h.style.cssText="padding:8px 0;font-size:16px";h.textContent="《"+title+"》";
  c.appendChild(h);
  for(var i=0;i<allChapters.length;i++){
    var ch=allChapters[i];
    var item=document.createElement("div");item.className="chapter-item";
    (function(mid,nm){item.onclick=function(){readChapter(mid,nm);};})(String(ch.id||""),ch.name||"");
    var span=document.createElement("span");span.className="name";span.textContent=ch.name||("章节"+(i+1));
    var arrow=document.createElement("span");arrow.className="arrow";arrow.innerHTML="›";
    item.appendChild(span);item.appendChild(arrow);c.appendChild(item);
  }
}

function readChapter(chId,title){
  curChapterId=chId;
  s("加载图片...");
  var area=document.getElementById("readerArea");
  // Find the manga first
  var m=allMangas.find(function(x){return String(x.id)===String(curMangaId);});
  if(!m){area.innerHTML="<p>漫画未找到</p>";showView("reader");return}
  area.innerHTML="<button class='back-btn' onclick='backToChapters()'>← 返回章节</button>";
  // Show notice about sample images
  var notice=document.createElement("div");notice.className="notice";
  notice.textContent="提示：本页展示嵌入数据中的预览图片，完整章节图片可在本地服务器中查看更多。";
  area.appendChild(notice);
  var pics=m.sample_pics||[];
  if(pics.length===0){
    var ph=document.createElement("div");ph.className="placeholder";ph.textContent="暂无预览图片";
    area.appendChild(ph);
    s("暂无预览图片");
  }
  var loaded=0;
  for(var i=0;i<pics.length;i++){
    var src=pics[i];
    if(!src)continue;
    var el=document.createElement("img");
    el.src=src;
    el.style.cssText="width:100%;margin-bottom:4px;border-radius:4px;background:#2a2a4a;min-height:200px;";
    el.onerror=function(){this.style.display="none";var ph=document.createElement("div");ph.className="placeholder";ph.textContent="图片加载失败 (网络问题)";this.parentNode.insertBefore(ph,this);};
    area.appendChild(el);
    loaded++;
    s("已加载 "+loaded+"/"+pics.length+" 张");
  }
  if(loaded===0){s("暂无图片");}
  else{s("共 "+loaded+" 张图片");}
  showView("reader");
}

function backToChapters(){
  var m=allMangas.find(function(x){return x.id===curMangaId;});
  if(m){renderChapters(m.title);}
  showView("chapters");
}

function doSearch(){
  var q=document.getElementById("searchInput").value.trim();
  if(!q){s("请输入关键词");return}
  s("搜索中...");
  var results=allMangas.filter(function(m){
    return m.title.indexOf(q)!==-1||m.tags.indexOf(q)!==-1;
  });
  if(results.length>0){
    renderMangas(results);
    showView("list");
    s("搜索「"+q+"」→ "+results.length+" 结果");
  }else{
    s("搜索「"+q+"」→ 0 结果");
  }
}

loadMangas();
</script>

</html>
