<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>栗子漫画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#1a1a2e;color:#eee}
.header{background:#16213e;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;border-bottom:1px solid #0f3460}
.header h1{font-size:18px;color:#e94560}
.container{max-width:960px;margin:0 auto;padding:10px}
#mangaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:8px 0}
.manga-card{background:#16213e;border-radius:8px;overflow:hidden;cursor:pointer}
.manga-card:hover{transform:scale(1.02)}
.manga-card .cover{width:100%;height:160px;object-fit:cover;background:#2a2a4a;display:block}
.manga-card .title{padding:6px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chapterList{padding:6px 0;max-height:70vh;overflow-y:auto}
.chapter-item{padding:12px 14px;background:#16213e;margin-bottom:6px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:1px solid transparent}
.chapter-item:hover{background:#1a2744}
.chapter-item.active{background:#0f3460;border-color:#e94560}
.chapter-item .name{flex:1;font-size:13px}
.chapter-item .arrow{color:#e94560;font-size:18px}
.reader-area{display:none;padding:8px 0}
.reader-area img{width:100%;margin-bottom:6px;border-radius:4px;background:#2a2a4a;min-height:200px}
.reader-area .placeholder{background:#2a2a4a;border-radius:4px;height:200px;display:flex;align-items:center;justify-content:center;color:#888;margin-bottom:6px}
.back-btn{background:#e94560;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;margin-bottom:10px;font-size:14px}
.back-btn:hover{background:#c73555}
.status{padding:10px;color:#888;font-size:13px;text-align:center}
.search-box{margin-bottom:12px;display:flex;gap:8px}
.search-box input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid #333;background:#16213e;color:#eee;font-size:14px}
.search-box input:focus{outline:none;border-color:#e94560}
.search-box button{padding:8px 16px;border-radius:6px;border:none;background:#e94560;color:#fff;cursor:pointer;font-size:14px}
.search-box button:hover{background:#c73555}
.tab{padding:10px 8px;color:#888;text-align:center;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;display:inline-block}
.tab:hover{color:#ccc}
.tab.active{color:#e94560;border-bottom-color:#e94560}
.notice{background:#0f3460;color:#e94560;padding:6px 10px;border-radius:4px;margin-bottom:8px;font-size:12px}
.loader{display:inline-block;width:20px;height:20px;border:3px solid #666;border-top:3px solid #e94560;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header"><div><h1>🍒 栗子漫画</h1></div></div>

<div style="background:#0f3460;border-bottom:1px solid #1a1a2e">
  <span class="tab active" onclick="showView('list')">📚列表</span>
  <span class="tab" onclick="showView('chapters')">📖章节</span>
  <span class="tab" onclick="showView('reader')">👁阅读</span>
</div>

<div class="container">
  <div class="notice" id="notice">点击任意漫画浏览章节 → 点击章节查看图片</div>
  <div class="search-box">
    <input id="searchInput" placeholder="搜索漫画..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
  </div>
  <div id="navBar" style="display:none;margin-bottom:10px"><button onclick="showView('list')">返回列表</button></div>
  <div id="mangaGrid"></div>
  <div id="chapterList"></div>
  <div id="readerArea" class="reader-area"></div>
  <div id="status" class="status"><span class="loader"></span> 加载中...</div>
</div>

<script>
// ===== 纯 JS MD5（正确实现，兼容浏览器）=====
function md5Js(s) {
  var bytes=[];
  for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);bytes.push(c&0xff);}
  var origLen=bytes.length;
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  var bitLen=origLen*8;
  bytes.push(bitLen&0xff);bytes.push((bitLen>>>8)&0xff);bytes.push((bitLen>>>16)&0xff);bytes.push((bitLen>>>24)&0xff);
  bytes.push((bitLen/0x100000000)&0xff);bytes.push(((bitLen/0x100000000)>>>8)&0xff);bytes.push(((bitLen/0x100000000)>>>16)&0xff);bytes.push(((bitLen/0x100000000)>>>24)&0xff);
  var K=[0xd76aa478,0xe8c7b756,0x242070db,0xc1bdceee,0xf57c0faf,0x4787c62a,0xa8304613,0xfd469501,0x698098d8,0x8b44f7af,0xffff5bb1,0x895cd7be,0x6b901122,0xfd987193,0xa679438e,0x49b40821,0xf61e2562,0xc040b340,0x265e5a51,0xe9b6c7aa,0xd62f105d,0x02441453,0xd8a1e681,0xe7d3fbc8,0x21e1cde6,0xc33707d6,0xf4d50d87,0x455a14ed,0xa9e3e905,0xfcefa3f8,0x676f02d9,0x8d2a4c8a,0xfffa3942,0x8771f681,0x6d9d6122,0xfde5380c,0xa4beea44,0x4bdecfa9,0xf6bb4b60,0xbebfbc70,0x289b7ec6,0xeaa127fa,0xd4ef3085,0x04881d05,0xd9d4d039,0xe6db99e5,0x1fa27cf8,0xc4ac5665,0xf4292244,0x432aff97,0xab9423a7,0xfc93a039,0x655b59c3,0x8f0ccc92,0xffeff47d,0x85845dd1,0x6fa87e4f,0xfe2ce6e0,0xa3014314,0x4e0811a1,0xf7537e82,0xbd3af235,0x2ad7d2bb,0xeb86d391];
  var S=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  var a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
  for(var off=0;off<bytes.length;off+=64){
    var M=[];
    for(var i=0;i<16;i++){var idx=off+i*4;M[i]=(bytes[idx]|(bytes[idx+1]<<8)|(bytes[idx+2]<<16)|(bytes[idx+3]<<24))>>>0;}
    var A=a0,B=b0,C=c0,D=d0;
    for(var j=0;j<64;j++){
      var F,g;
      if(j<16){F=(B&C)|(~B&D);g=j;}
      else if(j<32){F=(D&B)|(~D&C);g=(5*j+1)%16;}
      else if(j<48){F=B^C^D;g=(3*j+5)%16;}
      else{F=C^(B|~D);g=(7*j)%16;}
      var tmp=D;D=C;C=B;
      var x=(A+F+K[j]+M[g])>>>0;
      B=(B+((x<<S[j])|(x>>>(32-S[j]))))>>>0;
      A=tmp;
    }
    a0=(a0+A)>>>0;b0=(b0+B)>>>0;c0=(c0+C)>>>0;d0=(d0+D)>>>0;
  }
  function toHex(v){var h='';for(var i=0;i<4;i++){var b=(v>>>(i*8))&0xff;h+=(b<16?'0':'')+b.toString(16);}return h;}
  return toHex(a0)+toHex(b0)+toHex(c0)+toHex(d0);
}

function genLzsign(params) {
  var keys=Object.keys(params).sort();
  var s='';
  for(var i=0;i<keys.length;i++)s+=keys[i]+'='+params[keys[i]];
  s+=APPSIGN;
  return md5Js(s);
}

async function api(endpoint,extra){
  var params={platform:PLATFORM,packname:PACKNAME,t:String(Math.floor(Date.now()/1000))};
  if(extra)for(var k in extra)params[k]=extra[k];
  params.sign=genLzsign(params);
  var query=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
  var url=API_BASE+endpoint+'?'+query;
  var resp=await fetch(url,{headers:{'User-Agent':'LiziManga/1.0'}});
  var text=await resp.text();
  try{return JSON.parse(text);}catch(e){throw new Error('JSON解析失败: '+text.substring(0,200));}
}

// ===== 应用逻辑 =====
var API_BASE="http://ai.xajtl.com";
var APPSIGN="CDD266DF8B2399C24DA38E408B6D9825C7BD2AF073229847F551EA653EA096E1";
var PACKNAME="com.hbsclj.uth";
var PLATFORM="android";
var IMAGE_BASE="https://cdn.lzimg.xyz";
var curMangaId="",curMangaTitle="",curChapterId="",allMangas=[],allChapters=[];

function showView(v){
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle("active",["list","chapters","reader"].indexOf(v)===i);
  ["mangaGrid","chapterList","readerArea"].forEach(function(id){document.getElementById(id).style.display="none";});
  document.getElementById("navBar").style.display="none";
  if(v==="list"){document.getElementById("mangaGrid").style.display="grid";document.getElementById("navBar").style.display="flex";document.getElementById("notice").style.display="block";}
  else if(v==="chapters"){document.getElementById("chapterList").style.display="block";document.getElementById("navBar").style.display="flex";document.getElementById("notice").style.display="none";}
  else{document.getElementById("readerArea").style.display="block";document.getElementById("notice").style.display="none";}
}
function s(msg){document.getElementById("status").textContent=msg}

async function loadMangas(){
  s("加载漫画列表...");
  try{
    var mangas=[];
    // 1. home/data
    var d=await api("/app/api/home/data");
    var sections=d.data.home_content_list;
    for(var i=0;i<sections.length;i++){if(Array.isArray(sections[i].comic_list))mangas=mangas.concat(sections[i].comic_list);}
    // 2. rank/list (more manga)
    var r=await api("/app/api/rank/list");
    var ranks=r.data.rank_list||[];
    for(var i=0;i<ranks.length;i++){if(Array.isArray(ranks[i].comic_list))mangas=mangas.concat(ranks[i].comic_list);}
    // dedup by id
    var seen={};var unique=[];
    for(var i=0;i<mangas.length;i++){var m=mangas[i];var mid=String(m.id);if(!seen[mid]){seen[mid]=true;unique.push(m);}}
    allMangas=unique.map(function(m){return{id:String(m.id),title:m.name||"未知",cover:m.picY?IMAGE_BASE+m.picY:"",tags:m.tags||"",hits:m.hits||0};});
    renderMangas(allMangas);
    s("共 "+allMangas.length+" 部漫画");
  }catch(e){s("加载失败: "+e.message);console.error(e);}
}

function renderMangas(mangas){
  var c=document.getElementById("mangaGrid");c.innerHTML="";
  for(var i=0;i<mangas.length;i++){
    var m=mangas[i];
    var card=document.createElement("div");card.className="manga-card";
    card.onclick=(function(mid,mt){return function(){loadChapters(mid,mt);};})(m.id,m.title);
    var img=document.createElement("img");img.className="cover";img.src=m.cover||"";img.onerror=function(){this.style.display="none";};
    var title=document.createElement("div");title.className="title";title.textContent=m.title;
    card.appendChild(img);card.appendChild(title);c.appendChild(card);
  }
}

async function loadChapters(mangaId,title){
  curMangaId=mangaId;curMangaTitle=title;allChapters=[];
  s("加载章节...");
  try{
    var d=await api("/app/api/v2/detail/"+mangaId,{id:mangaId});
    var data=d.data;
    if(typeof data==='object'&&data!==null){var chs=data.chapters||[];allChapters=chs.map(function(c){return{id:String(c.id),name:c.name||""};});}
    renderChapters(title);showView("chapters");s("共 "+allChapters.length+" 章节");
  }catch(e){s("章节加载失败: "+e.message);console.error(e);}
}

function renderChapters(title){
  var c=document.getElementById("chapterList");c.innerHTML="";
  var h=document.createElement("h3");h.style.cssText="padding:8px 0;font-size:16px";h.textContent="《"+title+"》";
  c.appendChild(h);
  for(var i=0;i<allChapters.length;i++){
    var ch=allChapters[i];
    var item=document.createElement("div");item.className="chapter-item";
    var span=document.createElement("span");span.className="name";span.textContent=ch.name||("章节"+(i+1));
    var arrow=document.createElement("span");arrow.className="arrow";arrow.innerHTML="›";
    item.onclick=(function(cid,nm){return function(){readChapter(cid,nm);};})(ch.id,ch.name);
    item.appendChild(span);item.appendChild(arrow);c.appendChild(item);
  }
}

async function readChapter(chId,title){
  curChapterId=chId;s("加载图片...");
  var area=document.getElementById("readerArea");
  var m=allMangas.find(function(x){return String(x.id)===String(curMangaId);});
  if(!m){area.innerHTML="<p>漫画未找到</p>";showView("reader");return}
  area.innerHTML="<button class='back-btn' onclick='backToChapters()'>返回章节</button>";
  try{
    var d=await api("/app/api/chapter/v2/"+chId,{chapter_id:chId});
    var data=d.data;
    var pics=[];
    if(typeof data==='object'&&data!==null){pics=(data.pics||[]).filter(function(p){return typeof p==='string';}).map(function(p){return IMAGE_BASE+p;});}
    if(pics.length===0){var ph=document.createElement("div");ph.className="placeholder";ph.textContent="该章节暂无图片";area.appendChild(ph);s("暂无图片");}
    else{for(var i=0;i<pics.length;i++){var src=pics[i];var el=document.createElement("img");el.src=src;el.referrerPolicy="no-referrer";el.style.cssText="width:100%;margin-bottom:4px;border-radius:4px;background:#2a2a4a;min-height:200px;";el.onerror=function(){this.style.display="none";var ph=document.createElement("div");ph.className="placeholder";ph.textContent="图片加载失败";this.parentNode.insertBefore(ph,this);};area.appendChild(el);s("已加载 "+(i+1)+"/"+pics.length+" 张");}s("共 "+pics.length+" 张图片");}
  }catch(e){area.innerHTML+="<p style='color:#e94560'>加载失败: "+e.message+"</p>";s("加载失败: "+e.message);console.error(e);}
  showView("reader");
}

function backToChapters(){renderChapters(curMangaTitle);showView("chapters");}

async function doSearch(){
  var q=document.getElementById("searchInput").value.trim();
  if(!q){s("请输入关键词");return;}
  s("搜索中...");
  try{
    var d=await api("/app/api/search/full",{q:q});
    var items=d.data&&d.data.search_full||[];
    allMangas=items.map(function(m){return{id:String(m.id),title:m.name||"未知",cover:m.picY?IMAGE_BASE+m.picY:"",tags:m.tags||"",hits:m.hits||0};});
    renderMangas(allMangas);showView("list");s("搜索「"+q+"」→ "+allMangas.length+" 结果");
  }catch(e){s("搜索失败: "+e.message);console.error(e);}
}

loadMangas();
</script>
</body>
</html>
